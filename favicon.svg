<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="netflixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Dark Container with Crimson Accent Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#E50914" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Cinematic Lettermark "P" with Netflix Ribbon Depth -->
  <path d="M22 14 H35 C42 14 46 18 46 25 C46 32 42 36 35 36 H28 V50 H22 Z M28 20 V30 H34 C38 30 40 28 40 25 C40 22 38 20 34 20 Z" fill="url(#netflixRed)" filter="url(#crimsonGlow)" />
  
  <!-- Studio Neon Accent Dot -->
  <circle cx="44" cy="46" r="3.5" fill="#E50914" filter="url(#crimsonGlow)" />
</svg>